<!DOCTYPE html>
<html lang="hil">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congratulations, Nong Acab!</title>

    <style>
        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
        }

        body{
            font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;

            /* Replace background.jpg with your own image */
            background:
                linear-gradient(
                    rgba(59,7,100,0.80),
                    rgba(106,13,173,0.75)
                ),
                url('background.jpg');

            background-size:cover;
            background-position:center;
            background-attachment:fixed;

            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
            overflow-x:hidden;
        }

        /* Background Decorations */
        .background-decor{
            position:fixed;
            width:100%;
            height:100%;
            top:0;
            left:0;
            z-index:1;
            pointer-events:none;
            overflow:hidden;
        }

        .particle{
            position:absolute;
            width:15px;
            height:15px;
            border-radius:50%;
            animation:float 8s infinite linear;
        }

        .particle:nth-child(1){
            background:#FFD60A;
            left:10%;
            top:80%;
        }

        .particle:nth-child(2){
            background:#FF7A00;
            left:30%;
            top:90%;
            animation-delay:1s;
        }

        .particle:nth-child(3){
            background:#FFFFFF;
            left:50%;
            top:85%;
            animation-delay:2s;
        }

        .particle:nth-child(4){
            background:#FFD60A;
            left:70%;
            top:90%;
            animation-delay:3s;
        }

        .particle:nth-child(5){
            background:#FF7A00;
            left:90%;
            top:80%;
            animation-delay:4s;
        }

        @keyframes float{
            from{
                transform:translateY(0);
                opacity:0;
            }
            20%{
                opacity:1;
            }
            to{
                transform:translateY(-120vh);
                opacity:0;
            }
        }

        .card-container{
            background:rgba(255,255,255,0.96);
            backdrop-filter:blur(10px);
            border-radius:20px;
            box-shadow:0 15px 35px rgba(0,0,0,0.25);
            width:100%;
            max-width:500px;
            overflow:hidden;
            position:relative;
            z-index:2;
            animation:fadeInUp 1s ease-out;
            border:2px solid rgba(255,214,10,0.4);
        }

        .accent-bar{
            height:10px;
            background:linear-gradient(
                90deg,
                #6A0DAD,
                #FF7A00,
                #FFD60A
            );
        }

        .photo-wrapper{
            width:100%;
            padding:25px 25px 15px;
            display:flex;
            justify-content:center;
            background:linear-gradient(
                135deg,
                rgba(106,13,173,0.08),
                rgba(255,122,0,0.08)
            );
        }

        .grad-photo{
            width:100%;
            height:auto;
            max-height:350px;
            object-fit:cover;
            border-radius:12px;
            box-shadow:0 8px 20px rgba(0,0,0,0.15);
            border:4px solid white;
        }

        .letter-content{
            padding:30px;
            text-align:center;
        }

        .salutation{
            font-size:1.8rem;
            color:#6A0DAD;
            font-weight:700;
            margin-bottom:20px;
        }

        .message-body{
            font-size:1.1rem;
            color:#4a5568;
            line-height:1.8;
            margin-bottom:25px;
            text-align:justify;
        }

        .future-title{
            background:linear-gradient(
                135deg,
                #6A0DAD,
                #8B2FC9
            );
            color:white;
            padding:14px 24px;
            border-radius:50px;
            display:inline-block;
            font-weight:700;
            font-size:1.1rem;
            margin-bottom:25px;
            box-shadow:0 5px 15px rgba(106,13,173,0.3);
        }

        .closing{
            font-size:1.1rem;
            font-weight:600;
            color:#FF7A00;
            margin-top:15px;
        }

        .footer-emoji{
            font-size:2rem;
            margin-top:15px;
            animation:bounce 2s infinite;
        }

        .music-player{
            position:fixed;
            bottom:15px;
            right:15px;
            z-index:5;
            opacity:0.9;
        }

        @keyframes fadeInUp{
            from{
                opacity:0;
                transform:translateY(30px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        @keyframes bounce{
            0%,20%,50%,80%,100%{
                transform:translateY(0);
            }
            40%{
                transform:translateY(-10px);
            }
            60%{
                transform:translateY(-5px);
            }
        }

        @media(max-width:480px){
            .letter-content{
                padding:20px;
            }

            .salutation{
                font-size:1.5rem;
            }

            .message-body{
                font-size:1rem;
                line-height:1.6;
            }

            .music-player{
                width:220px;
            }
        }
    </style>
</head>
<body>

    <!-- Animated Background -->
    <div class="background-decor">
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
    </div>

    <div class="card-container">

        <div class="accent-bar"></div>

        <div class="photo-wrapper">
            <!-- Replace with your image -->
            <img src="graduation-photo.jpg"
                 alt="Jhon Del Acab Graduation Photo"
                 class="grad-photo">
        </div>

        <div class="letter-content">

            <h1 class="salutation">
                Congrats, Nong Acab! 🎓
            </h1>

            <p class="message-body">
                Deserve mo gid ni nga achievement. Proud kami sa imo kag sa imo pagpaninguha para maabot ini. Padayon lang, kay lapit na gid ang
            </p>

            <div class="future-title">
                Engr. Jhon Del Acab, RME! ⚙️
            </div>

            <p class="closing">
                Congratulations again Nong and God bless! 🙌
            </p>

            <div class="footer-emoji">🎉</div>

        </div>
    </div>

    <!-- Background Music -->
    <!-- Replace graduation-music.mp3 with your music file -->
 <!-- The hidden audio player -->
<audio id="bg-music" loop style="display: none;">
    <source src="graduation-music.mp3" type="audio/mpeg">
    Your browser does not support audio.
</audio>

<!-- The script that plays it on any tap or click -->
<script>
    document.addEventListener('click', function() {
        var audio = document.getElementById('bg-music');
        audio.play().catch(function(error) {
            console.log("Playback prevented. Waiting for a cleaner user interaction.");
        });
    }, { once: true }); // '{ once: true }' ensures this only triggers on the very first tap
</script>

</body>
</html>
